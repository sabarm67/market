openapi: 3.0.3
info:
  title: Share Market Monitoring & Investment Intelligence Platform API
  description: >
    MVP API — Bursa Malaysia only, 6 core modules, plus post-MVP roadmap modules as
    they're delivered (see docs/07-roadmap/future-enhancements-roadmap.md). See
    docs/00-overview/mvp-scope-definition.md for the MVP scope baseline.
  version: "0.3.0"
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Dashboard
  - name: Companies
  - name: Watchlists
  - name: Shariah
  - name: Screener
  - name: Alerts
  - name: Portfolios

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "201": { description: Account created, session established }
        "422": { description: Validation error }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      security: [{ sanctumSession: [] }]
      responses:
        "204": { description: Logged out }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Market dashboard aggregates (gainers, losers, volume, breadth)
      parameters:
        - in: query
          name: sub_market
          schema: { type: string, enum: [Main, ACE, LEAP] }
        - in: query
          name: sector_id
          schema: { type: integer }
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }

  /companies:
    get:
      tags: [Companies]
      summary: Search / list companies
      parameters:
        - in: query
          name: q
          description: Search by name or stock code
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated company list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCompanies" }

  /companies/{stockCode}:
    get:
      tags: [Companies]
      summary: Company profile
      parameters:
        - $ref: "#/components/parameters/StockCode"
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { description: Not found }

  /companies/{stockCode}/fundamentals:
    get:
      tags: [Companies]
      summary: Fundamental analysis data (current + historical)
      parameters:
        - $ref: "#/components/parameters/StockCode"
        - in: query
          name: period_type
          schema: { type: string, enum: [quarterly, annual], default: annual }
      responses:
        "200":
          description: Fundamental data series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundamentalSeries" }

  /companies/{stockCode}/technicals:
    get:
      tags: [Companies]
      summary: Basic technical chart data (OHLCV + indicators)
      parameters:
        - $ref: "#/components/parameters/StockCode"
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: indicators
          description: Comma-separated indicator list
          schema: { type: string, example: "ma,rsi,macd,bbands" }
      responses:
        "200":
          description: Price series with requested indicators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicalSeries" }

  /watchlists:
    get:
      tags: [Watchlists]
      summary: List current user's watchlists
      security: [{ sanctumSession: [] }]
      responses:
        "200":
          description: Watchlists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Watchlist" }
    post:
      tags: [Watchlists]
      summary: Create a watchlist
      security: [{ sanctumSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }

  /watchlists/{watchlistId}:
    delete:
      tags: [Watchlists]
      summary: Delete a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "403": { description: Not the owner }

  /watchlists/{watchlistId}/items:
    post:
      tags: [Watchlists]
      summary: Add a security to a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [security_id]
              properties:
                security_id: { type: integer }
                note: { type: string }
      responses:
        "201": { description: Added }

  /watchlists/{watchlistId}/items/{itemId}:
    delete:
      tags: [Watchlists]
      summary: Remove an item from a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Removed }

  /shariah/status/{stockCode}:
    get:
      tags: [Shariah]
      summary: Current + historical Shariah status for a security
      parameters:
        - $ref: "#/components/parameters/StockCode"
      responses:
        "200":
          description: Shariah status history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShariahStatusHistory" }

  /shariah/securities:
    get:
      tags: [Shariah]
      summary: Browse/filter securities by current Shariah status
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [compliant, non_compliant] }
      responses:
        "200":
          description: Filtered security list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShariahListItem" }

  /shariah/import:
    post:
      tags: [Shariah]
      summary: Admin — upload SC Malaysia list for preview
      security: [{ sanctumSession: [] }]
      description: Admin role required. Returns a preview/diff; does not commit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Parsed preview of status changes
        "403": { description: Admin role required }
        "422": { description: Malformed file }

  /shariah/import/{importId}/commit:
    post:
      tags: [Shariah]
      summary: Admin — commit a previewed Shariah import
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: importId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Import committed }
        "403": { description: Admin role required }

  /screener:
    get:
      tags: [Screener]
      summary: Multi-criteria stock screener (see FRS Module 7)
      parameters:
        - in: query
          name: sector_id
          schema: { type: integer }
        - in: query
          name: sub_market
          schema: { type: string, enum: [Main, ACE, LEAP] }
        - in: query
          name: shariah_status
          schema: { type: string, enum: [compliant, non_compliant] }
        - in: query
          name: market_cap_min
          schema: { type: number }
        - in: query
          name: market_cap_max
          schema: { type: number }
        - in: query
          name: pe_min
          schema: { type: number }
        - in: query
          name: pe_max
          schema: { type: number }
        - in: query
          name: pb_min
          schema: { type: number }
        - in: query
          name: pb_max
          schema: { type: number }
        - in: query
          name: roe_min
          schema: { type: number }
        - in: query
          name: dividend_yield_min
          schema: { type: number }
        - in: query
          name: debt_equity_max
          schema: { type: number }
        - in: query
          name: revenue_growth_min
          schema: { type: number, description: "Year-over-year %, from the two most recent annual periods" }
        - in: query
          name: volume_min
          schema: { type: integer }
        - in: query
          name: rsi_min
          schema: { type: number }
        - in: query
          name: rsi_max
          schema: { type: number }
        - in: query
          name: sort_by
          schema: { type: string, enum: [market_cap, pe, pb, roe, dividend_yield, debt_equity, revenue_growth_pct, volume, rsi], default: stock_code }
        - in: query
          name: sort_dir
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Filtered, sorted list of securities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenerResponse" }

  /sectors:
    get:
      tags: [Screener]
      summary: List all sectors (for the screener's sector filter)
      responses:
        "200":
          description: Sector list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sector" }

  /alerts/rules:
    get:
      tags: [Alerts]
      summary: List the current user's alert rules
      security: [{ sanctumSession: [] }]
      responses:
        "200":
          description: Alert rules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    post:
      tags: [Alerts]
      summary: Create an alert rule on a watchlist item
      security: [{ sanctumSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watchlist_item_id, type]
              properties:
                watchlist_item_id: { type: integer }
                type: { type: string, enum: [price_change_pct, volume_spike, new_52w_high, new_52w_low, shariah_status_change] }
                direction: { type: string, enum: [up, down, either] }
                threshold: { type: number, description: "Required for price_change_pct and volume_spike" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }

  /alerts/rules/{rule}:
    patch:
      tags: [Alerts]
      summary: Update an alert rule (active state, threshold, direction)
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: rule
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
    delete:
      tags: [Alerts]
      summary: Delete an alert rule
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: rule
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /alerts/triggers:
    get:
      tags: [Alerts]
      summary: List the current user's recent triggered alerts
      security: [{ sanctumSession: [] }]
      responses:
        "200":
          description: Recent triggers, most recent first (max 50)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AlertTrigger" } }

  /alerts/triggers/{trigger}/read:
    post:
      tags: [Alerts]
      summary: Mark a triggered alert as read
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: trigger
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Marked read }

  /portfolios:
    get:
      tags: [Portfolios]
      summary: List the current user's portfolios with a quick summary
      security: [{ sanctumSession: [] }]
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PortfolioSummary" } }
    post:
      tags: [Portfolios]
      summary: Create a portfolio
      security: [{ sanctumSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201": { description: Created }

  /portfolios/{portfolio}:
    get:
      tags: [Portfolios]
      summary: Full portfolio detail — holdings, sector allocation, totals, transaction history
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: portfolio
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Portfolio detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDetail" }
    delete:
      tags: [Portfolios]
      summary: Delete a portfolio and its transactions
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: portfolio
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /portfolios/{portfolio}/transactions:
    post:
      tags: [Portfolios]
      summary: Add a buy/sell transaction to a portfolio
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: portfolio
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [security_id, type, quantity, price, transaction_date]
              properties:
                security_id: { type: integer }
                type: { type: string, enum: [buy, sell] }
                quantity: { type: number }
                price: { type: number, description: "Per share" }
                transaction_date: { type: string, format: date }
                notes: { type: string }
      responses:
        "201": { description: Created }

  /portfolios/{portfolio}/transactions/{transaction}:
    delete:
      tags: [Portfolios]
      summary: Remove a transaction (holdings/gain-loss recalculate accordingly)
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: portfolio
          required: true
          schema: { type: integer }
        - in: path
          name: transaction
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum SPA session cookie auth.

  parameters:
    StockCode:
      in: path
      name: stockCode
      required: true
      schema: { type: string }
      example: "1234"

  schemas:
    DashboardResponse:
      type: object
      properties:
        as_of: { type: string, format: date-time }
        top_gainers: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        top_losers: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        top_volume: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        sector_performance:
          type: array
          items:
            type: object
            properties:
              sector: { type: string }
              change_pct: { type: number }
        breadth:
          type: object
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            new_highs_52w: { type: integer }
            new_lows_52w: { type: integer }

    MoverItem:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        change_pct: { type: number }
        volume: { type: integer }

    Company:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        sub_market: { type: string }
        sector: { type: string }
        overview: { type: string }
        business_segments: { type: string }
        listing_date: { type: string, format: date }
        management: { type: array, items: { type: string } }
        major_shareholders:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              holding_pct: { type: number }

    PaginatedCompanies:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Company" } }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    FundamentalSeries:
      type: object
      properties:
        stock_code: { type: string }
        period_type: { type: string, enum: [quarterly, annual] }
        periods:
          type: array
          items:
            type: object
            properties:
              period_end: { type: string, format: date }
              revenue: { type: number }
              net_profit: { type: number }
              net_margin: { type: number }
              eps: { type: number }
              roe: { type: number }
              roa: { type: number }
              debt_equity: { type: number }
              current_ratio: { type: number }
              dividend_per_share: { type: number }
              pe: { type: number }
              pb: { type: number }

    TechnicalSeries:
      type: object
      properties:
        stock_code: { type: string }
        as_of: { type: string, format: date-time }
        candles:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              open: { type: number }
              high: { type: number }
              low: { type: number }
              close: { type: number }
              volume: { type: integer }
        indicators:
          type: object
          description: Keyed by indicator name, e.g. "ma", "rsi", "macd", "bbands"
          additionalProperties: true

    Watchlist:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/WatchlistItem" }

    WatchlistItem:
      type: object
      properties:
        id: { type: integer }
        stock_code: { type: string }
        name: { type: string }
        price: { type: number }
        change_pct: { type: number }
        shariah_status: { type: string, enum: [compliant, non_compliant] }
        note: { type: string }

    ShariahStatusHistory:
      type: object
      properties:
        stock_code: { type: string }
        current:
          type: object
          properties:
            status: { type: string, enum: [compliant, non_compliant] }
            source_publication_date: { type: string, format: date }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [compliant, non_compliant] }
              source_publication_date: { type: string, format: date }

    ShariahListItem:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        status: { type: string, enum: [compliant, non_compliant] }

    Sector:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string, nullable: true }

    ScreenerResponse:
      type: object
      properties:
        total: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              stock_code: { type: string }
              name: { type: string }
              sector: { type: string, nullable: true }
              sub_market: { type: string, nullable: true }
              shariah_status: { type: string, enum: [compliant, non_compliant], nullable: true }
              price: { type: number }
              volume: { type: integer }
              market_cap: { type: number, nullable: true }
              pe: { type: number, nullable: true }
              pb: { type: number, nullable: true }
              roe: { type: number }
              debt_equity: { type: number }
              dividend_yield: { type: number, nullable: true }
              revenue_growth_pct: { type: number, nullable: true }
              rsi: { type: number, nullable: true }

    AlertRule:
      type: object
      properties:
        id: { type: integer }
        watchlist_item_id: { type: integer }
        stock_code: { type: string }
        name: { type: string }
        type: { type: string, enum: [price_change_pct, volume_spike, new_52w_high, new_52w_low, shariah_status_change] }
        direction: { type: string, enum: [up, down, either], nullable: true }
        threshold: { type: number, nullable: true }
        active: { type: boolean }

    AlertTrigger:
      type: object
      properties:
        id: { type: integer }
        stock_code: { type: string }
        type: { type: string }
        trigger_date: { type: string, format: date }
        message: { type: string }
        read_at: { type: string, format: date-time, nullable: true }

    PortfolioSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        market_value: { type: number }
        unrealized_gain: { type: number }
        unrealized_gain_pct: { type: number, nullable: true }

    Holding:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        sector: { type: string, nullable: true }
        quantity: { type: number }
        avg_cost: { type: number, nullable: true }
        cost_basis: { type: number }
        latest_price: { type: number, nullable: true }
        market_value: { type: number, nullable: true }
        unrealized_gain: { type: number, nullable: true }
        unrealized_gain_pct: { type: number, nullable: true }
        realized_gain: { type: number }
        allocation_pct: { type: number, nullable: true }

    PortfolioDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        holdings: { type: array, items: { $ref: "#/components/schemas/Holding" } }
        sector_allocation:
          type: array
          items:
            type: object
            properties:
              sector: { type: string }
              market_value: { type: number }
              pct: { type: number }
        totals:
          type: object
          properties:
            market_value: { type: number }
            cost_basis: { type: number }
            unrealized_gain: { type: number }
            unrealized_gain_pct: { type: number, nullable: true }
            realized_gain: { type: number }
        transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              stock_code: { type: string }
              name: { type: string }
              type: { type: string, enum: [buy, sell] }
              quantity: { type: number }
              price: { type: number }
              transaction_date: { type: string, format: date }
              notes: { type: string, nullable: true }
