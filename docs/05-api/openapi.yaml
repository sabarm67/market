openapi: 3.0.3
info:
  title: Share Market Monitoring & Investment Intelligence Platform API
  description: >
    MVP API — Bursa Malaysia only, 6 core modules. See
    docs/00-overview/mvp-scope-definition.md for scope.
  version: "0.1.0-mvp"
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Dashboard
  - name: Companies
  - name: Watchlists
  - name: Shariah

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "201": { description: Account created, session established }
        "422": { description: Validation error }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      security: [{ sanctumSession: [] }]
      responses:
        "204": { description: Logged out }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Market dashboard aggregates (gainers, losers, volume, breadth)
      parameters:
        - in: query
          name: sub_market
          schema: { type: string, enum: [Main, ACE, LEAP] }
        - in: query
          name: sector_id
          schema: { type: integer }
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }

  /companies:
    get:
      tags: [Companies]
      summary: Search / list companies
      parameters:
        - in: query
          name: q
          description: Search by name or stock code
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated company list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCompanies" }

  /companies/{stockCode}:
    get:
      tags: [Companies]
      summary: Company profile
      parameters:
        - $ref: "#/components/parameters/StockCode"
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { description: Not found }

  /companies/{stockCode}/fundamentals:
    get:
      tags: [Companies]
      summary: Fundamental analysis data (current + historical)
      parameters:
        - $ref: "#/components/parameters/StockCode"
        - in: query
          name: period_type
          schema: { type: string, enum: [quarterly, annual], default: annual }
      responses:
        "200":
          description: Fundamental data series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundamentalSeries" }

  /companies/{stockCode}/technicals:
    get:
      tags: [Companies]
      summary: Basic technical chart data (OHLCV + indicators)
      parameters:
        - $ref: "#/components/parameters/StockCode"
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: indicators
          description: Comma-separated indicator list
          schema: { type: string, example: "ma,rsi,macd,bbands" }
      responses:
        "200":
          description: Price series with requested indicators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicalSeries" }

  /watchlists:
    get:
      tags: [Watchlists]
      summary: List current user's watchlists
      security: [{ sanctumSession: [] }]
      responses:
        "200":
          description: Watchlists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Watchlist" }
    post:
      tags: [Watchlists]
      summary: Create a watchlist
      security: [{ sanctumSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }

  /watchlists/{watchlistId}:
    delete:
      tags: [Watchlists]
      summary: Delete a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "403": { description: Not the owner }

  /watchlists/{watchlistId}/items:
    post:
      tags: [Watchlists]
      summary: Add a security to a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [security_id]
              properties:
                security_id: { type: integer }
                note: { type: string }
      responses:
        "201": { description: Added }

  /watchlists/{watchlistId}/items/{itemId}:
    delete:
      tags: [Watchlists]
      summary: Remove an item from a watchlist
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: watchlistId
          required: true
          schema: { type: integer }
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Removed }

  /shariah/status/{stockCode}:
    get:
      tags: [Shariah]
      summary: Current + historical Shariah status for a security
      parameters:
        - $ref: "#/components/parameters/StockCode"
      responses:
        "200":
          description: Shariah status history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShariahStatusHistory" }

  /shariah/securities:
    get:
      tags: [Shariah]
      summary: Browse/filter securities by current Shariah status
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [compliant, non_compliant] }
      responses:
        "200":
          description: Filtered security list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShariahListItem" }

  /shariah/import:
    post:
      tags: [Shariah]
      summary: Admin — upload SC Malaysia list for preview
      security: [{ sanctumSession: [] }]
      description: Admin role required. Returns a preview/diff; does not commit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Parsed preview of status changes
        "403": { description: Admin role required }
        "422": { description: Malformed file }

  /shariah/import/{importId}/commit:
    post:
      tags: [Shariah]
      summary: Admin — commit a previewed Shariah import
      security: [{ sanctumSession: [] }]
      parameters:
        - in: path
          name: importId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Import committed }
        "403": { description: Admin role required }

components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum SPA session cookie auth.

  parameters:
    StockCode:
      in: path
      name: stockCode
      required: true
      schema: { type: string }
      example: "1234"

  schemas:
    DashboardResponse:
      type: object
      properties:
        as_of: { type: string, format: date-time }
        top_gainers: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        top_losers: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        top_volume: { type: array, items: { $ref: "#/components/schemas/MoverItem" } }
        sector_performance:
          type: array
          items:
            type: object
            properties:
              sector: { type: string }
              change_pct: { type: number }
        breadth:
          type: object
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            new_highs_52w: { type: integer }
            new_lows_52w: { type: integer }

    MoverItem:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        change_pct: { type: number }
        volume: { type: integer }

    Company:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        sub_market: { type: string }
        sector: { type: string }
        overview: { type: string }
        business_segments: { type: string }
        listing_date: { type: string, format: date }
        management: { type: array, items: { type: string } }
        major_shareholders:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              holding_pct: { type: number }

    PaginatedCompanies:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Company" } }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    FundamentalSeries:
      type: object
      properties:
        stock_code: { type: string }
        period_type: { type: string, enum: [quarterly, annual] }
        periods:
          type: array
          items:
            type: object
            properties:
              period_end: { type: string, format: date }
              revenue: { type: number }
              net_profit: { type: number }
              net_margin: { type: number }
              eps: { type: number }
              roe: { type: number }
              roa: { type: number }
              debt_equity: { type: number }
              current_ratio: { type: number }
              dividend_per_share: { type: number }
              pe: { type: number }
              pb: { type: number }

    TechnicalSeries:
      type: object
      properties:
        stock_code: { type: string }
        as_of: { type: string, format: date-time }
        candles:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              open: { type: number }
              high: { type: number }
              low: { type: number }
              close: { type: number }
              volume: { type: integer }
        indicators:
          type: object
          description: Keyed by indicator name, e.g. "ma", "rsi", "macd", "bbands"
          additionalProperties: true

    Watchlist:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/WatchlistItem" }

    WatchlistItem:
      type: object
      properties:
        id: { type: integer }
        stock_code: { type: string }
        name: { type: string }
        price: { type: number }
        change_pct: { type: number }
        shariah_status: { type: string, enum: [compliant, non_compliant] }
        note: { type: string }

    ShariahStatusHistory:
      type: object
      properties:
        stock_code: { type: string }
        current:
          type: object
          properties:
            status: { type: string, enum: [compliant, non_compliant] }
            source_publication_date: { type: string, format: date }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [compliant, non_compliant] }
              source_publication_date: { type: string, format: date }

    ShariahListItem:
      type: object
      properties:
        stock_code: { type: string }
        name: { type: string }
        status: { type: string, enum: [compliant, non_compliant] }
